services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lifehub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-lifehub}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lifehub} -d ${POSTGRES_DB:-lifehub}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-lifehub}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lifehub}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-lifehub}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lifehub}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      INSTANCE_CONFIG_PATH: /app/config/instance.yaml
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      DEBUG: ${DEBUG:-false}
    volumes:
      - ./config:/app/config:ro
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
